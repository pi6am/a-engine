name: console-binary

# Builds self-contained single-file console binaries (no .NET install
# needed) for the common platforms, bundles the scenarios + README, and
# attaches them to a GitHub Release on version tags. Manual runs
# (workflow_dispatch) upload the bundles as workflow artifacts instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file binary
        run: >
          dotnet publish src/AEngine.Cli -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Bundle scenarios + README
        run: |
          mkdir dist
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            mv publish/AEngine.Cli.exe dist/a-engine.exe
          else
            mv publish/AEngine.Cli dist/a-engine
          fi
          rm -rf publish
          cp -r scenarios dist/
          cp README.md LICENSE.md dist/

      - name: Archive
        run: |
          cd dist
          name="a-engine-${{ matrix.rid }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "../$name.zip" .
          else
            tar -czf "../$name.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: a-engine-${{ matrix.rid }}
          path: a-engine-${{ matrix.rid }}.${{ matrix.archive }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: a-engine-${{ matrix.rid }}.${{ matrix.archive }}
